services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: qtcsvc
      POSTGRES_USER: qtcsvc
      POSTGRES_PASSWORD: qtcsvc
    ports:
      - "5432:5432"
    volumes:
      - qtcsvc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtcsvc"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qtcsvc
      MINIO_ROOT_PASSWORD: qtcsvc123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qtcsvc_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

# backend, frontend, reverse-proxy se duoc them vao khi co Dockerfile thuc te
# (giai doan dong goi, sau khi UI hoan thanh) - xem spec muc 1 & 11.

volumes:
  qtcsvc_postgres_data:
  qtcsvc_minio_data:

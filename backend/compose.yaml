services:
  mariadb:
    image: 'mariadb:latest'
    environment:
      - 'MARIADB_DATABASE=qtcsvc'
      - 'MARIADB_PASSWORD=qtcsvc'
      - 'MARIADB_ROOT_PASSWORD=qtcsvc'
      - 'MARIADB_USER=qtcsvc'
    ports:
      - '3306'
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=qtcsvc'
      - 'MYSQL_PASSWORD=qtcsvc'
      - 'MYSQL_ROOT_PASSWORD=qtcsvc'
      - 'MYSQL_USER=qtcsvc'
    ports:
      - '3306'
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=qtcsvc'
      - 'POSTGRES_PASSWORD=qtcsvc'
      - 'POSTGRES_USER=qtcsvc'
    ports:
      - '5432'
